name: Android
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAISHINKIT_ANDROID_VERSION: ${{ vars.HAISHINKIT_ANDROID_VERSION || 'PR467-SNAPSHOT' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: KaiwaKit
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test, build and lint
        working-directory: KaiwaKit/android
        run: ./gradlew ktlintCheck :kaiwakit:testDebugUnitTest :app:assembleDebug :app:lintDebug -PhaishinKitVersion="$HAISHINKIT_ANDROID_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-verification
          path: |
            KaiwaKit/android/kaiwakit/build/reports/tests/
            KaiwaKit/android/app/build/reports/lint-results-debug.*
            KaiwaKit/android/app/build/intermediates/apk/debug/*.apk
