name: macOS sample
on:
  push:
    branches: [main]
    tags: ['*']
    paths: ['Examples/**', 'KaiwaKit/**', 'Package.swift', '.github/workflows/macos.yml']
  pull_request:
    paths: ['Examples/**', 'KaiwaKit/**', 'Package.swift', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-sample-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Apple Silicon app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build macOS sample
        run: |
          xcodebuild -project Examples/Examples.xcodeproj \
            -scheme 'Kaiwa Example' -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/kaiwa-example" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
      - name: Verify and archive app
        run: |
          APP="$RUNNER_TEMP/kaiwa-example/Build/Products/Debug/Kaiwa Example.app"
          codesign --verify --deep --strict "$APP"
          lipo "$APP/Contents/MacOS/Kaiwa Example" -verify_arch arm64
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/KaiwaKit-macOS-arm64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KaiwaKit-macOS-arm64
          path: ${{ runner.temp }}/KaiwaKit-macOS-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  publish:
    name: Attach app to GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: KaiwaKit-macOS-arm64
          path: ${{ runner.temp }}/release
      - name: Publish macOS app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSET: ${{ runner.temp }}/release/KaiwaKit-macOS-arm64.zip
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
